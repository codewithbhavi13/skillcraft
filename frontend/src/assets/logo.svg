<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="100" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#007BFF; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF; stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Border with Gradient Fill -->
  <polygon points="20,50 40,20 80,20 100,50 80,80 40,80" 
      stroke="#005FAD" stroke-width="3" fill="url(#gradient)"/>

  <!-- Code Symbol </> in Black -->
  <text x="50" y="55" font-family="Arial" font-size="20" fill="black" font-weight="bold">&lt;/&gt;</text>
</svg>
